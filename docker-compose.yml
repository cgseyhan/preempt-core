version: "3.9"

services:
  preemptcore:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: scan repo /workspace

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./preemptcore.db
    command: ["python", "-m", "uvicorn", "preemptcore.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
